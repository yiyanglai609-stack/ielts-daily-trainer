<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Daily Trainer</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#171923;
  --muted:#6b7280;
  --line:#e5e7eb;
  --dark:#111827;
  --soft:#eef2ff;
  --green:#047857;
  --red:#b91c1c;
  --warn:#92400e;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:15px;
  background:rgba(246,247,251,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.wrap{
  max-width:980px;
  margin:auto;
}

h1{
  margin:0 0 5px;
  font-size:22px;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
}

main{
  padding:0 14px 50px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:15px 0;
}

.tab{
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:11px 5px;
  font-weight:700;
}

.tab.active{
  background:var(--dark);
  color:white;
}

.panel{display:none}
.panel.active{display:block}

.day{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  margin:12px 0;
}

.day>summary{
  list-style:none;
  cursor:pointer;
  padding:16px;
  font-size:17px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.day>summary::-webkit-details-marker{display:none}

.day>summary:after{
  content:"＋";
  font-size:22px;
  font-weight:400;
}

.day[open]>summary:after{
  content:"－";
}

.daybody{
  border-top:1px solid var(--line);
  padding:11px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin:10px 0;
}

.title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.note{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(225px,1fr));
  gap:9px;
}

.word{
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
}

.wordtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.en{
  font-size:17px;
  font-weight:800;
}

.zh{
  margin-top:5px;
}

.small{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  line-height:1.5;
}

.warning{
  color:var(--warn);
  font-size:13px;
  font-weight:700;
  margin-top:5px;
  line-height:1.5;
}

.speak{
  border:0;
  background:var(--soft);
  padding:7px 9px;
  border-radius:9px;
}

.row{
  padding:11px 0;
  border-top:1px solid var(--line);
  line-height:1.6;
}

.row:first-child{
  border-top:0;
}

.inner{
  padding:10px 0;
  border-top:1px solid var(--line);
}

.inner:first-child{
  border-top:0;
}

.inner summary{
  font-weight:700;
  line-height:1.6;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:1px solid #d8dce5;
  border-radius:9px;
  font-size:16px;
}

.check{
  background:var(--dark);
  color:white;
  border:0;
  border-radius:9px;
  padding:8px 11px;
  margin-top:7px;
}

.result{
  font-size:14px;
  font-weight:700;
  margin-top:6px;
}

.good{color:var(--green)}
.bad{color:var(--red)}

.template{
  background:#f9fafb;
  border-radius:11px;
  padding:11px;
  margin:7px 0;
  line-height:1.7;
  font-size:14px;
}

.empty{
  color:var(--muted);
  padding:20px 5px;
}

@media(max-width:650px){
  .tabs{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="wrap">
  <h1>IELTS 最后冲刺训练站</h1>
  <div class="subtitle">
    按科目 · 按日期 · 错词 · 发音 · 同义替换 · 长难句 · 练习
  </div>
</div>
</header>

<main class="wrap">

<div class="tabs">
  <button class="tab active" data-tab="listening">听力</button>
  <button class="tab" data-tab="reading">阅读</button>
  <button class="tab" data-tab="speaking">口语</button>
  <button class="tab" data-tab="writing">写作</button>
</div>

<section id="listening" class="panel active"></section>
<section id="reading" class="panel"></section>
<section id="speaking" class="panel"></section>
<section id="writing" class="panel"></section>

</main>

<script src="data.js"></script>

<script>
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("当前浏览器不支持语音朗读");
    return;
  }

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-GB";
  u.rate=.82;
  speechSynthesis.speak(u);
}

function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function vocabCard(day,type){
  if(!day.vocab || !day.vocab.length) return "";

  const corrections=day.corrections || {};

  return `
    <div class="card">
      <div class="title">今日生词</div>
      <div class="note">点 🔊 听发音。</div>

      <div class="grid">
        ${day.vocab.map(v=>`
          <div class="word">
            <div class="wordtop">
              <div class="en">${esc(v[0])}</div>

              <button class="speak"
              onclick='speak(${JSON.stringify(v[0])})'>
              🔊
              </button>
            </div>

            <div class="zh">${esc(v[1])}</div>

            <div class="small">
              近似读法：${esc(v[2])}
            </div>

            <div class="small">
              同义 / 相关：${esc(v[3])}
            </div>

            ${corrections[v[0]]
              ? `<div class="warning">${esc(corrections[v[0]])}</div>`
              : ""
            }
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function synonymCard(day){
  if(!day.synonyms || !day.synonyms.length) return "";

  return `
    <div class="card">
      <div class="title">同义替换</div>

      ${day.synonyms.map((x,i)=>`
        <div class="row">
          <b>${i+1}. ${esc(x[0])}</b>
          → ${esc(x[1])}
        </div>
      `).join("")}
    </div>
  `;
}

function sentenceCard(day){
  if(!day.sentences || !day.sentences.length) return "";

  return `
    <div class="card">
      <div class="title">长难句训练</div>
      <div class="note">
        先看英文判断意思，再展开中文。
      </div>

      ${day.sentences.map((x,i)=>`
        <details class="inner">
          <summary>
            ${i+1}. ${esc(x[0])}

            <button class="speak"
            onclick='event.preventDefault();event.stopPropagation();speak(${JSON.stringify(x[0])})'>
            🔊
            </button>
          </summary>

          <div style="padding-top:7px">
            ${esc(x[1])}
          </div>
        </details>
      `).join("")}
    </div>
  `;
}

function practiceCard(day,key){
  if(!day.vocab || !day.vocab.length) return "";

  const words=day.vocab.slice(0,20);

  return `
    <div class="card">
      <div class="title">20词拼写练习</div>

      ${words.map((v,i)=>`
        <div class="row">

          <b>${i+1}. ${esc(v[1])}</b>

          <input
          id="${key}input${i}"
          type="text"
          placeholder="输入英文">

          <button class="check"
          onclick='checkWord(
            "${key}input${i}",
            ${JSON.stringify(v[0])},
            "${key}result${i}"
          )'>
          检查
          </button>

          <button class="speak"
          onclick='speak(${JSON.stringify(v[0])})'>
          🔊
          </button>

          <div
          id="${key}result${i}"
          class="result">
          </div>

        </div>
      `).join("")}
    </div>
  `;
}

function checkWord(inputId,answer,resultId){
  const input=
    document.getElementById(inputId)
    .value
    .trim()
    .toLowerCase();

  const result=document.getElementById(resultId);

  if(input===answer.toLowerCase()){
    result.innerHTML='<span class="good">✓ 正确</span>';
  }else{
    result.innerHTML=
      '<span class="bad">✗ 正确答案：'+esc(answer)+'</span>';
  }
}

function reminderCard(day){
  if(!day.reminders || !day.reminders.length) return "";

  return `
    <div class="card">
      <div class="title">今日提醒</div>

      ${day.reminders.map((x,i)=>`
        <div class="row">
          <b>${i+1}.</b> ${esc(x)}
        </div>
      `).join("")}
    </div>
  `;
}

function taskCard(title,data){
  if(!data || !data.length) return "";

  return `
    <div class="card">
      <div class="title">${title}</div>

      ${data.map(block=>`
        <details class="inner">
          <summary>${esc(block.name)}</summary>

          <div style="padding-top:7px">
            ${block.content.map(x=>`
              <div class="template">${esc(x)}</div>
            `).join("")}
          </div>

        </details>
      `).join("")}
    </div>
  `;
}

function normalDay(day,type,dateKey){
  return `
    ${vocabCard(day,type)}
    ${synonymCard(day)}
    ${sentenceCard(day)}
    ${practiceCard(day,type+dateKey.replaceAll("-",""))}
    ${reminderCard(day)}
  `;
}

function writingDay(day){
  return `
    ${taskCard("Task 2｜大作文",day.task2)}
    ${taskCard("Task 1｜小作文",day.task1)}
    ${reminderCard(day)}
  `;
}

function renderSubject(type){
  const container=document.getElementById(type);
  const subject=(window.IELTS_DATA || {})[type] || {};

  const dates=Object.keys(subject).sort((a,b)=>b.localeCompare(a));

  if(!dates.length){
    container.innerHTML='<div class="empty">暂时还没有内容。</div>';
    return;
  }

  container.innerHTML=dates.map((dateKey,index)=>{
    const day=subject[dateKey];

    return `
      <details class="day" ${index===0 ? "open" : ""}>
        <summary>${esc(day.title || dateKey)}</summary>

        <div class="daybody">
          ${
            type==="writing"
            ? writingDay(day)
            : normalDay(day,type,dateKey)
          }
        </div>
      </details>
    `;
  }).join("");
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab")
      .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".panel")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    document
      .getElementById(btn.dataset.tab)
      .classList.add("active");
  });
});

["listening","reading","speaking","writing"]
  .forEach(renderSubject);
</script>

</body>
</html>
